services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aereoio-geospatial-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/storage/aereo_geo.db
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
