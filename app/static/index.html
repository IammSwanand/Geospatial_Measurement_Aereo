<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geospatial File Measurement API - Quick Test</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 30px 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    input[type="file"] {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px dashed var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-box {
      display: none;
      padding: 12px 16px;
      border-radius: 6px;
      margin-top: 14px;
      font-size: 0.9rem;
    }
    .status-box.loading {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1e3a8a33;
      border: 1px solid #1d4ed8;
      color: #93c5fd;
    }
    .status-box.error {
      display: block;
      background: #7f1d1d33;
      border: 1px solid var(--danger);
      color: #fca5a5;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #93c5fd;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .metric {
      background: #0f172a;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 6px;
    }
    .metric-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }
    .metric-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin-top: 4px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 4px;
      background: #047857;
      color: #a7f3d0;
    }
    pre {
      background: #0b1120;
      padding: 14px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.82rem;
      color: #e2e8f0;
      max-height: 400px;
      border: 1px solid var(--border);
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Geospatial File Measurement API</h1>
      <p class="subtitle">Quick Test Interface &bull; Shapefile (.zip) &amp; KML (.kml)</p>
    </header>

    <div class="card">
      <div class="form-group">
        <label for="fileInput">Select Geospatial File</label>
        <input type="file" id="fileInput" accept=".kml,.zip">
      </div>
      <button id="uploadBtn">Upload &amp; Measure</button>
      <div id="statusBox" class="status-box"></div>
    </div>

    <div id="resultsCard" class="card hidden">
      <h2 style="font-size: 1.1rem; margin-bottom: 14px;">File Information &amp; Summary</h2>
      <div class="grid">
        <div class="metric">
          <div class="metric-label">File ID</div>
          <div class="metric-value" id="resFileId" style="font-size: 1rem; font-family: monospace;">-</div>
        </div>
        <div class="metric">
          <div class="metric-label">Status</div>
          <div class="metric-value"><span class="badge" id="resStatus">COMPLETED</span></div>
        </div>
        <div class="metric">
          <div class="metric-label">CRS</div>
          <div class="metric-value" id="resCrs">-</div>
        </div>
        <div class="metric">
          <div class="metric-label">Total Features</div>
          <div class="metric-value" id="resFeatures">-</div>
        </div>
        <div class="metric">
          <div class="metric-label">Total Area</div>
          <div class="metric-value" id="resArea">-</div>
        </div>
        <div class="metric">
          <div class="metric-label">Total Length</div>
          <div class="metric-value" id="resLength">-</div>
        </div>
      </div>

      <h3 style="font-size: 0.95rem; margin-bottom: 8px; color: var(--text-muted);">Measurements Output (JSON)</h3>
      <pre id="jsonOutput"></pre>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin.startsWith('http') ? window.location.origin : 'http://localhost:8000';
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusBox = document.getElementById('statusBox');
    const resultsCard = document.getElementById('resultsCard');

    uploadBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) {
        showStatus('Please select a .kml or .zip file first.', 'error');
        return;
      }

      uploadBtn.disabled = true;
      resultsCard.classList.add('hidden');
      showStatus('<div class="spinner"></div><span>Uploading and processing geospatial features...</span>', 'loading');

      const formData = new FormData();
      formData.append('file', file);

      try {
        // 1. Upload file with synchronous processing for instant evaluator feedback
        const uploadRes = await fetch(`${API_BASE}/api/files/?sync=true`, {
          method: 'POST',
          body: formData
        });

        if (!uploadRes.ok) {
          const err = await uploadRes.json().catch(() => ({ detail: 'Upload failed' }));
          throw new Error(err.detail || err.error || 'Upload error');
        }

        const fileRecord = await uploadRes.json();
        const fileId = fileRecord.id;

        // 2. Fetch Measurements
        const measRes = await fetch(`${API_BASE}/api/files/${fileId}/measurements/`);
        if (!measRes.ok) {
          throw new Error('Failed to retrieve file measurements.');
        }

        const measData = await measRes.json();
        renderResults(measData);
        hideStatus();
      } catch (err) {
        showStatus(err.message, 'error');
      } finally {
        uploadBtn.disabled = false;
      }
    });

    function showStatus(html, type) {
      statusBox.className = `status-box ${type}`;
      statusBox.innerHTML = html;
      statusBox.style.display = type === 'loading' ? 'flex' : 'block';
    }

    function hideStatus() {
      statusBox.style.display = 'none';
    }

    function renderResults(data) {
      document.getElementById('resFileId').textContent = data.id;
      document.getElementById('resStatus').textContent = data.status;
      document.getElementById('resCrs').textContent = data.crs;
      document.getElementById('resFeatures').textContent = data.feature_count;

      const area = data.summary?.total_area_sq_m;
      const length = data.summary?.total_length_m;

      document.getElementById('resArea').textContent = area > 0 ? `${area.toLocaleString()} m²` : '0 m²';
      document.getElementById('resLength').textContent = length > 0 ? `${length.toLocaleString()} m` : '0 m';

      document.getElementById('jsonOutput').textContent = JSON.stringify(data, null, 2);
      resultsCard.classList.remove('hidden');
    }
  </script>
</body>
</html>
